<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Название сервера — CS 1.6</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="wrapper">

        <!-- ШАПКА -->
        <header>
            <img src="logo.svg" alt="CS 1.6 logo" class="logo" />
            <h1 id="serverName">Название сервера</h1>
            <p class="subtitle">⚡ Counter-Strike 1.6 — классика</p>
        </header>

        <!-- ИНФО О СЕРВЕРЕ -->
        <section class="server-info">
            <div class="status">
                <span class="dot"></span>
                <span id="serverStatus">Онлайн</span>
            </div>
            <div class="ip-block">
                <span class="label">IP-адрес:</span>
                <span id="serverIp">0.0.0.0:27015</span>
                <button id="copyBtn">📋</button>
            </div>
            <div class="players">
                <span id="playersCount">0</span> / <span id="maxPlayers">32</span>
                <span class="label">игроков</span>
            </div>
        </section>

        <!-- КНОПКИ -->
        <div class="actions">
            <a href="steam://connect/0.0.0.0:27015" class="btn primary">🎮 Подключиться</a>
            <button id="refreshBtn" class="btn secondary">🔄 Обновить</button>
        </div>

        <!-- СПИСОК ИГРОКОВ -->
        <section class="players-list">
            <h2>Список игроков</h2>
            <div id="playersTable">
                <div class="empty">Игроков нет или сервер не отвечает</div>
            </div>
        </section>

        <!-- ФУТЕР -->
        <footer>
            <p>© 2026 Название сервера. Counter-Strike 1.6</p>
            <p class="small">Сервер работает на build 4314</p>
        </footer>

    </div>

    <script>
        // ============================================================
        // КОНФИГУРАЦИЯ СЕРВЕРА (меняй здесь)
        // ============================================================

        const SERVER_NAME = "Название сервера";        // ← название
        const SERVER_IP = "0.0.0.0:27015";             // ← IP:порт
        const SERVER_PROTOCOL = "steam";              // steam / valve

        // ============================================================
        // КОД
        // ============================================================

        document.getElementById('serverName').textContent = SERVER_NAME;
        document.getElementById('serverIp').textContent = SERVER_IP;

        // Кнопка "Подключиться"
        document.querySelector('.btn.primary').href = `steam://connect/${SERVER_IP}`;

        // Копирование IP
        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(SERVER_IP).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅';
                setTimeout(() => btn.textContent = '📋', 1500);
            });
        });

        // Обновление статуса
        async function fetchServerStatus() {
            const statusEl = document.getElementById('serverStatus');
            const dotEl = document.querySelector('.dot');
            const playersEl = document.getElementById('playersCount');
            const tableEl = document.getElementById('playersTable');

            statusEl.textContent = 'Загрузка...';
            dotEl.style.background = '#fbbf24';

            try {
                // Запрос к публичному API (если есть)
                const response = await fetch(`https://api.steampowered.com/ISteamApps/GetServersAtAddress/v1/?addr=${SERVER_IP}`);
                if (!response.ok) throw new Error('API не отвечает');

                const data = await response.json();
                const players = data?.response?.servers?.[0]?.players || 0;
                const max = data?.response?.servers?.[0]?.max_players || 32;

                playersEl.textContent = players;
                document.getElementById('maxPlayers').textContent = max;

                if (players > 0) {
                    statusEl.textContent = 'Онлайн';
                    dotEl.style.background = '#34d399';
                    // Имитация списка
                    tableEl.innerHTML = `
                        <div class="player-row">
                            <span>Игрок 1</span>
                            <span>${Math.floor(Math.random() * 200)}</span>
                        </div>
                        <div class="player-row">
                            <span>Игрок 2</span>
                            <span>${Math.floor(Math.random() * 200)}</span>
                        </div>
                    `;
                } else {
                    statusEl.textContent = 'Пусто';
                    dotEl.style.background = '#f87171';
                    tableEl.innerHTML = `<div class="empty">На сервере никого нет</div>`;
                }

            } catch (err) {
                statusEl.textContent = 'Не отвечает';
                dotEl.style.background = '#f87171';
                tableEl.innerHTML = `<div class="empty">Сервер не отвечает (возможно, офлайн)</div>`;
                console.warn('Ошибка:', err.message);
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchServerStatus);

        // Запуск при загрузке
        fetchServerStatus();

        // Обновление каждые 30 секунд
        setInterval(fetchServerStatus, 30000);
    </script>

</body>
</html>
